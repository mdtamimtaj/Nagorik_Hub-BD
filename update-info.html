<!doctype html><html lang='bn'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>তথ্য আপডেট — Nagorik Hub</title><link rel='stylesheet' href='css/style.css'></head><body><nav class='nav'><div class='nav-inner'><a class='brand' href='index.html'>🇧🇩 Nagorik <span>Hub</span></a><button class='menu'>☰</button><div class='navlinks'><a href='index.html'>Home</a><a href='vegetables.html'>Vegetables</a><a href='grocery.html'>Grocery</a><a href='bus-fare.html'>Bus Fare</a><a href='update-info.html' class='active'>তথ্য আপডেট</a><a href='complaint.html'>Complaint</a><a href='helplines.html'>Help Lines</a></div></div></nav><main class='container'><div class='section-head'><div><h2>নাগরিক তথ্য আপডেট</h2><p>নতুন তথ্য পাঠান। Local AI প্রাথমিক পরীক্ষা করবে, এরপর Admin final review করবে।</p></div></div><form id='updateForm' class='card' style='padding:20px;max-width:760px'><label>তথ্যের ধরন</label><select id='updateCategory' class='select' required><option value='market'>বাজারদর</option><option value='bus'>বাস ভাড়া</option><option value='new_info'>নতুন তথ্য</option></select><div id='marketFields' class='dynamic-fields'><label>পণ্য</label><input id='marketProduct' class='input'><label>দাম (৳)</label><input id='marketPrice' class='input' type='number' min='0' step='0.01'><label>স্থান</label><input id='marketLocation' class='input'><label>তারিখ</label><input id='marketDate' class='input' type='date'></div><div id='busFields' class='dynamic-fields' hidden><label>From</label><input id='busFrom' class='input'><label>To</label><input id='busTo' class='input'><label>ভাড়া (৳)</label><input id='busFare' class='input' type='number' min='0' step='0.01'><label>Route info</label><input id='busRouteInfo' class='input'></div><div id='newInfoFields' class='dynamic-fields' hidden><label>শিরোনাম</label><input id='infoTitle' class='input'><label>স্থান</label><input id='infoLocation' class='input'></div><label>আপনার নাম</label><input id='reporterName'
