<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Nagorik Hub</title><link rel="stylesheet" href="css/style.css"><style>
.login-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:28px 16px}.login-card{width:min(460px,100%);background:var(--card,#fff);border:1px solid rgba(0,0,0,.08);border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(0,0,0,.10)}.login-card h1{margin:0 0 8px}.login-card p{color:#667085}.login-card label{display:block;font-weight:700;margin:18px 0 7px}.login-card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d0d5dd;border-radius:12px;font:inherit}.login-btn{width:100%;margin-top:22px}.login-msg{margin-top:14px;padding:11px 13px;border-radius:10px;background:#fff7ed;color:#9a3412}.login-msg.good{background:#ecfdf3;color:#166534}.login-links{display:flex;justify-content:space-between;margin-top:16px;font-size:14px}.password-row{position:relative}.password-row button{position:absolute;right:7px;top:7px;border:0;background:transparent;padding:8px;cursor:pointer}
</style></head><body>
<nav class="nav"><div class="nav-inner"><a class="brand" href="index.html">🇧🇩 Nagorik <span>Hub</span></a><div class="navlinks"><a href="index.html">Home</a><a href="update-info.html">তথ্য আপডেট</a></div></div></nav>
<main class="login-wrap"><section class="login-card"><h1>🔐 Admin Login</h1><p>Nagorik Hub-এর নিরাপদ Admin Panel-এ প্রবেশ করুন।</p><form id="loginForm"><label for="email">Admin Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"><label for="password">Password</label><div class="password-row"><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"><button id="togglePassword" type="button" aria-label="Show password">👁️</button></div><button class="btn login-btn" type="submit">Login</button></form><div id="loginMsg" class="login-msg" hidden></div><div class="login-links"><a href="index.html">← Website</a><a href="#" id="resetLink">Forgot password?</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script src="js/admin-auth.js"></script></body></html>
