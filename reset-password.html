<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Nagorik Hub</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container" style="max-width:520px;padding-top:60px"><div class="panel"><h2>🔑 নতুন Admin Password</h2><form id="resetForm"><label>New password</label><input id="password" type="password" minlength="8" required style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px"><button class="btn">Update Password</button></form><p id="msg"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script>const c=supabase.createClient(window.NAGORIK_SUPABASE_URL,window.NAGORIK_SUPABASE_ANON_KEY);document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const {error}=await c.auth.updateUser({password:document.getElementById('password').value});document.getElementById('msg').textContent=error?error.message:'Password updated. You can now login.';if(!error)setTimeout(()=>location.href='admin-login.html',1200)};</script></body></html>
